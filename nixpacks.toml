[phases.setup]
nixPkgs = [
  "nodejs_20",
  "python311",
  "python311Packages.pip",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "libdrm",
  "dbus",
  "libxkbcommon",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "mesa",
  "expat",
  "xorg.libX11",
  "xorg.libXext",
  "xorg.libXtst",
  "pango",
  "cairo",
  "alsa-lib",
  "at-spi2-atk",
  "at-spi2-core"
]

[phases.install]
cmds = [
  "npm install",
  "pip install playwright python-pptx --break-system-packages",
  "playwright install chromium --with-deps"
]

[start]
cmd = "node server.js"

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/root/.cache/ms-playwright"
